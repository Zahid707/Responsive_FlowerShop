<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Flower Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="nav-bar flex roboto-font">
            <img src="assets/logo.png" alt="">
            <ul class="nav-items-box flex">
                <li class="nav-items text-bold">Home</li>
                <li class="nav-items text-light">Shop</li>
                <li class="nav-items text-light">About Us</li>
                <li class="cart-logo flex">
                    <img src="assets/shopping cart.png" alt="">
                    <span>Cart ($-56)</span>
                </li>
                
            </ul>
        </nav>
        <div class="banner flex">
            <div class="banner-content">
                <h1 class="banner-title noto-serif-font">ALWAYS <span class="text-org">FRESH FLOWERS</span></h1>
                <p class="banner-text inter-font">Indulge your senses with the beauty and fragrance of our fresh flower shop. From classic roses to exotic blooms, we offer a wide variety of fresh flowers that are perfect for any occasion. </p>
            </div>           
            <img src="assets/hero-flower.png" alt="">
        </div>
    </header>
</body>
</html>
